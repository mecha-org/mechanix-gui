
[package]
name = "mechanix-launcher"
description = "Launcher application"
edition = "2024"
version = "0.0.1"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
gpui = { workspace = true }
commons = { path = "../commons" }
settings = { path = "../settings" }
theme = { path = "../theme" }
status_bar = { path = "../status_bar" }
settings_drawer = { path = "../settings_drawer" }
universal_search = { path = "../universal_search" }
running_apps = { path = "../running_apps" }
notifications = { path = "../notifications" }
homescreen = { path = "../homescreen" }
dispatcher = { path = "../dispatcher" }
shell_state = { path = "../shell_state" }

[package.metadata.deb]
maintainer = "Akshay Raina <akshayr@mechasystems.com>"
extended-description = """\
Launcher application."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    # target/release path is special, and gets replaced by cargo-deb with the actual target dir path.
    [
        "../../../target/release/mechanix-launcher",
        "usr/bin/",
        "755",
    ],
    [
        "../../../assets/icons/app-drawer/*",
        "usr/share/mechanix/shell/launcher/assets/icons/app-drawer/",
        "755",
    ],
    [
        "../../../assets/icons/running-apps/*",
        "usr/share/mechanix/shell/launcher/assets/icons/running-apps/",
        "755",
    ],
    [
        "../../../assets/icons/settings-drawer/*",
        "usr/share/mechanix/shell/launcher/assets/icons/settings-drawer/",
        "755",
    ],
    [
        "../../../assets/icons/status-bar/*",
        "usr/share/mechanix/shell/launcher/assets/icons/status-bar/",
        "755",
    ],
    [
        "../../../assets/icons/universal-search/*",
        "usr/share/mechanix/shell/launcher/assets/icons/universal-search/",
        "755",
    ],
    [
        "../../../assets/icons/notifications/*",
        "usr/share/mechanix/shell/launcher/assets/icons/notifications/",
        "755",
    ]
]
