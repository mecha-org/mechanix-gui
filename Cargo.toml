[workspace]
resolver = "3"
members = [
    "services/desktop",
    "services/conf",
    "services/system",
    "services/search/*",
    "services/extensions",
    "shell/crates/*",
    "shared/hw-buttons",
    "dbus/freedesktop/*",
    "dbus/mechanix/mxconf",
    "dbus/mechanix/extensions",
    "dbus/mechanix/system",
]

[workspace.package]
version = "0.0.1"
authors = [
    "Akshay Raina <akshayr@mechasystems.com>",
    "Shoaib Merchant <shoaibm@mechasystems.com>",
]
edition = "2021"
license = "MIT"
repository = "https://github.com/mecha-org/mechanix-gui"
homepage = "https://mecha.so"
categories = ["gui"]
keywords = ["linux", "shell", "mobile", "gui", "ui"]

[workspace.dependencies]
mxconf_dbus = { path = "dbus/mechanix/mxconf" }
notify = { version = "8.2.0" }
tokio = { version = "1.46.1", features = ["full"] }
log = { version = "0.4.27" }
anyhow = { version = "1.0.99" }
zbus = "4.1.2"
serde = { version = "1.0.219", features = ["derive"] }
futures = "0.3.31"
thiserror = "2.0.12"
env_logger = { version = "0.11.8" }
gpui = { version = "0.2.2", default-features = false, features = ["x11"] }
rust-embed = "8.8.0"
