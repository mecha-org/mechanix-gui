name: Apps - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - ".github/workflows/build-apps-aarch64.yml"
      - "apps/**"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MECHANIX_APTLY_SERVER_ENDPOINT: ${{ vars.MECHANIX_APTLY_SERVER_ENDPOINT }}
  MECHANIX_APTLY_DEB_REPOSITORY_DISTRO: ${{ vars.MECHANIX_APTLY_DEB_REPOSITORY_DISTRO }}
  MECHANIX_APTLY_DEB_REPOSITORY_NAME: ${{ vars.MECHANIX_APTLY_DEB_REPOSITORY_NAME }}
  MECHANIX_APTLY_S3_PUBLISH_ENDPOINT: ${{ vars.MECHANIX_APTLY_S3_PUBLISH_ENDPOINT }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings app
            folder: settings
            binary: mechanix_settings

          - name: camera app
            folder: camera
            binary: camera

          - name: notes app
            folder: notes
            binary: mechanix_notes

          - name: files app
            folder: files
            binary: mechanix_files

    runs-on: ubicloud-standard-2-arm
    environment: pre-release

    steps:
      # Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git tar unzip curl clang cmake pkg-config \
            libwayland-dev libwayland-cursor0 libwayland-egl1 \
            libwayland-egl-backend-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev

      # Checkout repository
      - name: Setup | Checkout
        uses: actions/checkout@v4

      # Install Flutter eLinux
      - name: Install Flutter eLinux
        run: |
          if [ ! -d "/opt/flutter-elinux" ]; then
            git clone https://github.com/sony/flutter-elinux.git
            sudo mv flutter-elinux /opt/
          fi
          echo "PATH=$PATH:/opt/flutter-elinux/bin" >> $GITHUB_ENV

      # Build the app
      - name: Build ${{ matrix.name }}
        working-directory: apps/${{ matrix.folder }}
        run: |
          flutter-elinux pub get
          flutter-elinux build elinux --release

      # Move entire bundle to ./build/<binary>
      - name: Prepare build folder ${{ matrix.name }}
        run: |
          mkdir -p ./build/${{ matrix.binary }}
          cp -r "apps/${{ matrix.folder }}/build/elinux/arm64/release/bundle/"* "./build/${{ matrix.binary }}/"

      # Package Debian
      - name: Package Debian ${{ matrix.name }}
        run: |
          set -euo pipefail
          app_folder="apps/${{ matrix.folder }}"
          pkg_name=$(grep '^Package:' "$app_folder/debian/control" | awk '{print $2}')
          pkg_version=$(grep '^Version:' "$app_folder/debian/control" | awk '{print $2}')
          pkg_arch=$(dpkg --print-architecture)
          mkdir -p package/DEBIAN
          cp -r "$app_folder/debian/"* package/DEBIAN/
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/mechanix/$pkg_name/data
          mkdir -p package/usr/share/mechanix/$pkg_name/lib
          mkdir -p package/usr/lib/$pkg_name
          # Patch Architecture field
          if grep -q '^Architecture:' package/DEBIAN/control; then
            sed -i "s/^Architecture:.*/Architecture: $pkg_arch/" package/DEBIAN/control
          else
            sed -i "/^Description:/i Architecture: $pkg_arch" package/DEBIAN/control
          fi
          # Copy binary
          cp "./build/${{ matrix.binary }}/${{ matrix.binary }}" package/usr/bin/${{ matrix.binary }}
          chmod 755 package/usr/bin/${{ matrix.binary }}
          # Copy assets
          if [ -d "./build/${{ matrix.binary }}/data" ]; then
            cp -r "./build/${{ matrix.binary }}/data/"* package/usr/share/mechanix/$pkg_name/data/
          fi
          # Copy private libraries
          if [ -d "./build/${{ matrix.binary }}/lib" ]; then
            cp -r "./build/${{ matrix.binary }}/lib/"* package/usr/share/mechanix/$pkg_name/lib/
          fi
          # Build .deb into ./build/deb/
          mkdir -p ./build/deb
          dpkg-deb --build package "./build/deb/${pkg_name}_${pkg_version}_${pkg_arch}.deb"

      # Extract package details
      - name: Extract package details
        id: package_details
        run: |
          PACKAGE_PATH=$(ls build/deb/*.deb | head -n1)
          PACKAGE_NAME=$(basename "$PACKAGE_PATH")
          FOLDER_NAME=$(echo "$PACKAGE_NAME" | cut -d'_' -f1)
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "Package Name: $PACKAGE_NAME"
          echo "Folder Name: $FOLDER_NAME"

      # Upload package to Aptly
      - name: Upload package to Aptly
        continue-on-error: true
        run: |
          echo "Uploading package: ${{ steps.package_details.outputs.package_name }}"
          echo "To folder: ${{ steps.package_details.outputs.folder_name }}"
          curl -X POST -F file=@build/deb/${{ steps.package_details.outputs.package_name }} \
            ${{ env.MECHANIX_APTLY_SERVER_ENDPOINT }}/api/files/${{ steps.package_details.outputs.folder_name }}

      # Add package to local repo
      - name: Add package to local repo
        continue-on-error: true
        run: |
          echo "Adding package from folder: ${{ steps.package_details.outputs.folder_name }}"
          curl -X POST ${{ env.MECHANIX_APTLY_SERVER_ENDPOINT }}/api/repos/${{ env.MECHANIX_APTLY_DEB_REPOSITORY_NAME }}/file/${{ steps.package_details.outputs.folder_name }}

      # Update local published repo
      - name: Update local published repo
        continue-on-error: true
        run: |
          echo "Updating local published repo for MECHANIX_APTLY_DEB_REPOSITORY_DISTRO: ${{ env.MECHANIX_APTLY_DEB_REPOSITORY_DISTRO }}"
          curl -X PUT -H 'Content-Type: application/json' --data '{
            "Architectures": ["arm64", "amd64"],
            "Signing": {"Skip": true}
          }' ${{ env.MECHANIX_APTLY_SERVER_ENDPOINT }}/api/publish/:./${{ env.MECHANIX_APTLY_DEB_REPOSITORY_DISTRO }}

      # Update S3 published repo
      - name: Update S3 published repo
        continue-on-error: true
        run: |
          echo "Updating S3 published repo for MECHANIX_APTLY_DEB_REPOSITORY_DISTRO: ${{ env.MECHANIX_APTLY_DEB_REPOSITORY_DISTRO }}"
          curl -X PUT -H 'Content-Type: application/json' --data '{
            "Sources": [{"Name": "${{ env.MECHANIX_APTLY_DEB_REPOSITORY_NAME }}"}],
            "Architectures": ["arm64", "amd64"],
            "Signing": {"Skip": true}
          }' ${{ env.MECHANIX_APTLY_SERVER_ENDPOINT }}/api/publish/s3:${{ env.MECHANIX_APTLY_S3_PUBLISH_ENDPOINT }}:/${{ env.MECHANIX_APTLY_DEB_REPOSITORY_DISTRO }}

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-aarch64
          path: |
            build/deb/*.deb
            build/${{ matrix.binary }}/*
