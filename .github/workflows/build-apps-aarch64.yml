name: Apps - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - ".github/workflows/build-apps-aarch64.yml"

env:
  FLUTTER_ELINUX_HOME: /opt/flutter-elinux

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings app
            folder: settings
            binary: mechanix_settings
        # Add more apps here as needed
        #   - name: camera app
        #     folder: camera
        #     binary: mechanix_camera
        #   - name: notes app
        #     folder: notes
        #     binary: mechanix_notes

    runs-on: ubicloud-standard-2-arm
    continue-on-error: true
    steps:
      # Install dependencies
      - name: Install dependencies
        run: |
          apt update
          apt install -y git tar unzip curl clang cmake pkg-config libwayland-dev libwayland-cursor0 libwayland-egl1 libwayland-egl-backend-dev libegl1-mesa-dev libgles2-mesa-dev

      # Checkout
      - name: Setup | Checkout
        uses: actions/checkout@v4

      # Install Flutter eLinux
      - name: Install Flutter eLinux
        run: |
          if [ ! -d "${FLUTTER_ELINUX_HOME}" ]; then
            git clone https://github.com/sony/flutter-elinux.git
            sudo mv flutter-elinux ${FLUTTER_ELINUX_HOME}
          fi
          export PATH="${FLUTTER_ELINUX_HOME}/bin:$PATH"
          flutter-elinux --version

      # Build the app
      - name: Build ${{ matrix.name }}
        working-directory: apps/${{ matrix.folder }}
        run: |
          export PATH="${FLUTTER_ELINUX_HOME}/bin:$PATH"
          flutter-elinux build elinux

      # Prepare artifact
      - name: Prepare artifact ${{ matrix.name }}
        run: |
          mkdir -p build
          cp apps/${{ matrix.folder }}/build/elinux/arm64/release/bundle/${{ matrix.binary }} ./build/

      # Upload artifact
      - name: Upload artifact ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ./build/${{ matrix.binary }}
