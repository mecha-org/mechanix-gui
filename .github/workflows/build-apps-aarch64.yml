name: Apps - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - ".github/workflows/build-apps-aarch64.yml"
      - "apps/**"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings app
            folder: settings
            binary: mechanix_settings

          - name: camera app
            folder: camera
            binary: camera

          - name: notes app
            folder: notes
            binary: mechanix_notes

          - name: files app
            folder: files
            binary: mechanix_files

    runs-on: ubicloud-standard-2-arm
    environment: pre-release
    continue-on-error: true
    steps:
      # Install dependencies
      - name: Install dependencies
        run: |
          sudo  apt update
          sudo apt install -y git tar unzip curl clang cmake pkg-config \
            libwayland-dev libwayland-cursor0 libwayland-egl1 \
            libwayland-egl-backend-dev libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev

      # Checkout repository
      - name: Setup | Checkout
        uses: actions/checkout@v4

      # Install Flutter eLinux
      - name: Install Flutter eLinux
        run: |
          if [ ! -d "/opt/flutter-elinux" ]; then
            git clone https://github.com/sony/flutter-elinux.git
            mv flutter-elinux /opt/
          fi
          # Persist for future steps
          echo "PATH=$PATH:/opt/flutter-elinux/bin" >> $GITHUB_ENV

      # Build the app
      - name: Build ${{ matrix.name }}
        working-directory: apps/${{ matrix.folder }}
        run: |
          flutter-elinux pub get
          flutter-elinux build elinux --release

      # Prepare artifact
      - name: Prepare artifact ${{ matrix.name }}
        run: |
          mkdir -p build
          # Copy only from bundle directory
          cp "apps/${{ matrix.folder }}/build/elinux/arm64/release/bundle/${{ matrix.binary }}" ./build/ || true

      - name: Package Debian ${{ matrix.name }}
        run: |
          app_folder="apps/${{ matrix.folder }}"

          # Extract package name & version from control file
          pkg_name=$(grep '^Package:' "$app_folder/debian/control" | awk '{print $2}')
          pkg_version=$(grep '^Version:' "$app_folder/debian/control" | awk '{print $2}')
          pkg_arch=$(dpkg --print-architecture)

          mkdir -p package
          cp -r "$app_folder/debian" package/DEBIAN
          mkdir -p package/usr/bin
          mkdir -p package/usr/share/$pkg_name

          # Patch control file with architecture
          if ! grep -q '^Architecture:' package/DEBIAN/control; then
            echo "Architecture: $pkg_arch" >> package/DEBIAN/control
          else
            sed -i "s/^Architecture:.*/Architecture: $pkg_arch/" package/DEBIAN/control
          fi

          # Copy binary
          cp ./build/${{ matrix.binary }} package/usr/bin/${{ matrix.binary }}
          chmod 755 package/usr/bin/${{ matrix.binary }}

          # Build .deb package
          dpkg-deb --build package "${pkg_name}_${pkg_version}_${pkg_arch}.deb"

      # list artifacts
      - name: List artifacts ${{ matrix.name }}
        run: |
          ls -la ./build/

      # Upload artifact
      - name: Upload artifact ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ./build/${{ matrix.binary }}
