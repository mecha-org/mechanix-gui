name: Dbus - Build aarch64
on:
  # Allow manual runs
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre*
    paths:
      - "apps/**" # only run if changes inside apps folder
      - ".github/workflows/build-dbus-aarch64.yml" # also run if apps workflow is changed

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  MACOSX_DEPLOYMENT_TARGET: 10.7
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
  MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
  MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
  MECHA_PULP_DEBS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bluez
            package: bluez
            artifact: bluez-aarch64-unknown-linux-gnu.tar.gz
            path: dbus/freedesktop
            folder: bluez

          - name: networkmanager
            package: networkmanager
            artifact: networkmanager-aarch64-unknown-linux-gnu.tar.gz
            path: dbus/freedesktop
            folder: networkmanager

          - name: pulseaudio
            package: pulseaudio
            artifact: pulseaudio-aarch64-unknown-linux-gnu.tar.gz
            path: dbus/freedesktop
            folder: pulseaudio

          - name: upower
            package: upower
            artifact: upower-aarch64-unknown-linux-gnu.tar.gz
            path: dbus/freedesktop
            folder: upower

          - name: mxconf
            package: mxconf
            artifact: mxconf-aarch64-unknown-linux-gnu.tar.gz
            path: dbus/mechanix
            folder: mxconf_dbus

    runs-on: ubicloud-standard-2-arm
    continue-on-error: false
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup default 1.85.0

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Update apt
        run: sudo apt update

      - name: Install dependencies
        run: |
          sudo apt install \
          libwayland-dev \
          libxkbcommon-dev \
          libdbus-1-dev \
          libpam0g-dev \
          libclang-dev \
          protobuf-compiler \
          libpulse-dev \
          libunwind-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libgstreamer-plugins-bad1.0-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-libav \
          gstreamer1.0-tools \
          gstreamer1.0-x \
          gstreamer1.0-alsa \
          gstreamer1.0-gl \
          gstreamer1.0-gtk3 \
          gstreamer1.0-qt5 \
          gstreamer1.0-pulseaudio \
          python3-pip \
          python3-venv \
          jq
      - name: Set up Git SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GIT }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build [${{ matrix.package }}]
        run: |
          cd ${{ matrix.path }}
          cargo --config net.git-fetch-with-cli=true fetch
          cargo build --release --package ${{ matrix.package }}
          ls -la

      - name: Package deb [${{ matrix.package }}]
        run: |
          cd ${{ matrix.path }}
          cargo deb --no-build --package ${{ matrix.package }}
          ls -la

      - name: Extract package details
        id: package_details
        run: |
          cd ${{ matrix.path }}
          PACKAGE_NAME=$(ls target/debian/*.deb | xargs basename)
          FOLDER_NAME=$(echo $PACKAGE_NAME | sed -r 's/_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+.*$//')
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "folder_name=$FOLDER_NAME" >> $GITHUB_OUTPUT
          echo "Package Name: $PACKAGE_NAME"
          echo "Folder Name: $FOLDER_NAME"

      - name: Prepare artifacts [${{ matrix.package }}]
        run: |
          mkdir build
          cp ${{ matrix.path }}/target/release/${{ matrix.package }} ./build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./build/*
