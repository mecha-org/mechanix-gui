name: Shell - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - "shell/**"
      - ".github/workflows/build-shell-aarch64.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
  MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
  MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
  MECHA_PULP_DEBS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Notification
            package: mechanix-notification
          - name: Launcher
            package: mechanix-launcher
          - name: Keyboard
            package: mechanix-keyboard

    runs-on: ubicloud-standard-2-arm
    environment: pre-release
    continue-on-error: false
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            g++ \
            pkg-config \
            libx11-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libgles2-mesa-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libpam0g-dev \
            libclang-dev \
            libpulse-dev \
            libasound-dev \
            python3-pip \
            pipx \
            jq \
            curl \
            librust-alsa-sys-dev \
            libpulse-dev \
            libasound2-dev

      # Pulp CLI setup
      - name: Setup | Pulp CLI
        run: |
          pipx install --force pulp-cli[pygments]
          pipx inject pulp-cli pulp-cli-deb

      - name: Setup | Pulp CLI Configuration
        run: |
          set -euo pipefail
          if [[ -z "$MECHA_PULP_API_URL" ]]; then
            echo "[ERROR] MECHA_PULP_API_URL is empty."
            exit 1
          fi
          # Construct full Pulp API URL (add port)
          PULP_API_URL="${MECHA_PULP_API_URL}:8080"
          echo "[INFO] Using Pulp base URL: $PULP_API_URL"

          # Configure Pulp CLI using the correct env vars
          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "$PULP_API_URL" \
            --overwrite

      - name: Build [${{ matrix.package }}]
        run: |
          cargo --config net.git-fetch-with-cli=true fetch
          cargo build --release --package ${{ matrix.package }}
          ls -la target/release

      - name: Package deb [${{ matrix.package }}]
        run: |
          sudo apt install -y fakeroot
          fakeroot cargo deb --no-build --package ${{ matrix.package }}
          ls -la target/debian

      - name: Repack DEB natively [${{ matrix.package }}]
        run: |
          set -euo pipefail
          DEB_FILE=$(ls target/debian/${{ matrix.package }}_*.deb | head -n1)
          echo "[INFO] Repacking: $DEB_FILE"

          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT

          # Extract
          dpkg-deb -R "$DEB_FILE" "$TMPDIR/pkg"

          # Fix ownership (and add other adjustments if needed)
          sudo chown -R root:root "$TMPDIR/pkg"

          # Repack with same filename
          dpkg-deb -b "$TMPDIR/pkg" "$DEB_FILE"

          echo "[INFO] ✅ Repacked: $DEB_FILE"   

      - name: Prepare artifacts [${{ matrix.package }}]
        run: |
          mkdir -p build
          cp target/release/${{ matrix.package }} ./build || true
          cp target/debian/${{ matrix.package }}_*.deb ./build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-artifacts
          path: ./build/*

      - name: Publish to Pulp [${{ matrix.package }}]
        run: |
          set -euo pipefail
          DEB_FILE=$(ls target/debian/${{ matrix.package }}_*.deb | head -n1)
          echo "[INFO] Uploading: $DEB_FILE"
          pulp deb content upload \
            --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --file="$DEB_FILE"

          echo "[INFO] Creating publication..."
          PUB_HREF=$(pulp deb publication create \
            --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            | jq -r '.pulp_href')

          echo "[INFO] Updating distribution..."
          pulp deb distribution update \
            --name="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --base-path="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}"

          echo "[INFO] ✅ Package ${{ matrix.package }} published."
