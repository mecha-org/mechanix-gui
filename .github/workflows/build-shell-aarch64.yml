name: Shell - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - "shell/**"
      - ".github/workflows/build-shell-aarch64.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Notification
            package: mechanix-notification
          - name: Launcher
            package: mechanix-launcher
          - name: Keyboard
            package: mechanix-keyboard

    runs-on: ubicloud-standard-2-arm
    continue-on-error: false
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.86.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libpam0g-dev \
            libclang-dev \
            libpulse-dev \
            python3-pip \
            pipx \
            jq \
            curl

      - name: Set up Git SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GIT }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Pulp CLI setup
      - name: Setup | Pulp CLI
        run: |
          pipx install --force pulp-cli[pygments]
          pipx inject pulp-cli pulp-cli-deb

      - name: Setup | Pulp CLI Configuration
        env:
          MECHA_PULP_API_URL: ${{ env.MECHA_PULP_API_URL }}
          MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
          MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
        run: |
          # Normalize URL (add http:// if missing)
          if [[ "${MECHA_PULP_API_URL}" != http* ]]; then
            BASE_URL="http://${MECHA_PULP_API_URL}:8080"
          else
            BASE_URL="${MECHA_PULP_API_URL}:8080"
          fi

          echo "[INFO] Using Pulp base URL: $BASE_URL"

          pulp config create \
            --username "$MECHA_PULP_USERNAME" \
            --password "$MECHA_PULP_PASSWORD" \
            --base-url "$BASE_URL" \
            --overwrite

      - name: Build [${{ matrix.package }}]
        run: |
          cargo --config net.git-fetch-with-cli=true fetch
          cargo build --release --package ${{ matrix.package }}
          ls -la target/release

      - name: Package deb [${{ matrix.package }}]
        run: |
          cargo deb --no-build --package ${{ matrix.package }}
          ls -la target/debian

      - name: Prepare artifacts [${{ matrix.package }}]
        run: |
          mkdir -p build
          cp target/release/${{ matrix.package }} ./build || true
          cp target/debian/${{ matrix.package }}_*.deb ./build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-artifacts
          path: ./build/*

      - name: Publish to Pulp [${{ matrix.package }}]
        run: |
          set -euo pipefail
          DEB_FILE=$(ls target/debian/${{ matrix.package }}_*.deb | head -n1)
          echo "[INFO] Uploading: $DEB_FILE"
          pulp deb content upload \
            --repository="${{ env.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --file="$DEB_FILE"

          echo "[INFO] Creating publication..."
          PUB_HREF=$(pulp deb publication create \
            --repository="${{ env.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            | jq -r '.pulp_href')

          echo "[INFO] Updating distribution..."
          pulp deb distribution update \
            --name="${{ env.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --base-path="${{ env.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --repository="${{ env.MECHA_PULP_DEBS_REPOSITORY_NAME }}"

          echo "[INFO] ✅ Package ${{ matrix.package }} published."
