name: Services - Build aarch64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-arm64-build
      - pre-release
    paths:
      - "services/**"
      - ".github/workflows/build-services-aarch64.yml"

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  MECHA_PULP_USERNAME: ${{ secrets.MECHA_PULP_USERNAME }}
  MECHA_PULP_PASSWORD: ${{ secrets.MECHA_PULP_PASSWORD }}
  MECHA_PULP_API_URL: ${{ vars.MECHA_PULP_API_URL }}
  MECHA_PULP_DEBS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}
  MECHA_PULP_RPMS_REPOSITORY_NAME: ${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}

jobs:
  # 1. Detect which services have changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      mxconf: ${{ steps.filter.outputs.mxconf }}
      session_service: ${{ steps.filter.outputs.session_service }}
      mxsearch: ${{ steps.filter.outputs.mxsearch }}
      system_service: ${{ steps.filter.outputs.system_service }}
      extension_service: ${{ steps.filter.outputs.extension_service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mxconf:
              - 'services/conf/**'
            session_service:
              - 'services/desktop/**'
            mxsearch:
              - 'services/search/server/**'
            system_service:
              - 'services/system/**'
            extension_service:
              - 'services/extensions/**'
  # 2. Build and Publish
  build:
    name: ${{ matrix.name }}
    needs: detect-changes
    runs-on: ubuntu-24.04-arm
    container:
      image: mechaorg/services-builder:arm64
    defaults:
      run:
        shell: bash -l {0}
    environment: pre-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conf service
            package: mxconf
            path: services/conf
            key: mxconf
          - name: session dbus service
            package: session_service
            path: services/desktop
            key: session_service
          - name: search service
            package: mxsearch
            path: services/search/server
            key: mxsearch
          - name: system dbus service
            package: mechanix-system-service
            path: services/system
            key: system_service
          - name: extension service
            package: mechanix-extension-service
            path: services/extensions
            key: extension_service

    steps:
      - name: Checkout
        uses: actions/checkout@v4      

      - name: Cache Cargo Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup | Pulp CLI
        run: |
          PULP_API_URL="${MECHA_PULP_API_URL}:8080"
          pulp config create --username "$MECHA_PULP_USERNAME" --password "$MECHA_PULP_PASSWORD" \
            --base-url "$PULP_API_URL" --overwrite
      - name: Set up Git SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_GIT }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Upstream Version Read ${{ matrix.package }}
        id: upstream_version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps --manifest-path ${{ matrix.path }}/Cargo.toml | \
            jq -r ".packages[] | select(.name == \"${{ matrix.package }}\") | .version")
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "[ERROR] Could not resolve version for ${{ matrix.package }}"
            exit 1
          fi
          echo "Detected Version: $VERSION"
          echo "upstream=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build [${{ matrix.package }}]
        run: cargo build --release --package ${{ matrix.package }}

      - name: Resolve versions [${{ matrix.package }}]
        id: version_info
        run: |
          set -euo pipefail
          # 1. Resolve DEB Version Info
          JSON_DEB=$(nu utils/resolve-next-version.nu \
            --format deb \
            --name ${{ matrix.package }} \
            --upstream ${{ steps.upstream_version.outputs.upstream }} | tr -d '\n')
          # 2. Resolve RPM Version Info
          JSON_RPM=$(nu utils/resolve-next-version.nu \
            --format rpm \
            --name ${{ matrix.package }} \
            --upstream ${{ steps.upstream_version.outputs.upstream }} | tr -d '\n')
          echo "DEB JSON: $JSON_DEB"
          echo "RPM JSON: $JSON_RPM"
          # Extract revisions using jq
          DEB_REV=$(echo "$JSON_DEB" | jq -r '.next_revision')
          RPM_REV=$(echo "$JSON_RPM" | jq -r '.next_revision')
          # Set outputs for subsequent steps
          echo "deb_revision=$DEB_REV" >> "$GITHUB_OUTPUT"
          echo "rpm_revision=$RPM_REV" >> "$GITHUB_OUTPUT"
      - name: Package deb
        run: |
          cargo deb --deb-revision "${{ steps.version_info.outputs.deb_revision }}" --no-build --package ${{ matrix.package }}
          DEB_FILE=$(ls target/debian/*.deb | head -n1)
          if [[ -z "$DEB_FILE" ]]; then
            echo "[ERROR] No .deb file found in target/debian/"
            exit 1
          fi
          echo "[INFO] Found package: $DEB_FILE. Starting native repack..."
          # 3. Repack natively
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          fakeroot dpkg-deb -R "$DEB_FILE" "$TMPDIR/pkg"
          fakeroot dpkg-deb -b "$TMPDIR/pkg" "$DEB_FILE"
          echo "[INFO] ✅ Repack complete: $DEB_FILE"
      - name: Generate RPM
        run: |
          cargo generate-rpm -s 'release = "${{ steps.version_info.outputs.rpm_revision }}"' -p "${{ matrix.path }}"
      - name: Prepare build folder
        run: |
          mkdir -p build/deb build/rpm
          cp target/debian/*.deb build/deb/ || echo "No DEB found"
          cp target/generate-rpm/*.rpm build/rpm/ || echo "No RPM found"
      - name: Check Publish Condition
        id: check_publish
        run: |
          SHOULD_PUBLISH="false"
          # Check the output from the detect-changes job for this specific matrix key
          if [[ "${{ needs.detect-changes.outputs[matrix.key] }}" == "true" ]]; then
            SHOULD_PUBLISH="true"
          fi          
          echo "should_publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT
      - name: Publish DEB
        if: steps.check_publish.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          # Find any .deb file in the specific deb build folder
          DEB_FILE=$(find ./build/deb -name "*.deb" -type f | head -n1)
          if [[ -z "$DEB_FILE" ]]; then
            echo "[ERROR] No .deb file found in ./build/deb"
            exit 1
          fi
          echo "[INFO] 📦 Publishing DEB: $DEB_FILE"
          pulp deb content upload --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" --file="$DEB_FILE"
          pulp deb publication create \
            --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --signing-service=mecha-pkg-sign
            
          pulp deb distribution update \
            --name="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --base-path="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}" \
            --repository="${{ vars.MECHA_PULP_DEBS_REPOSITORY_NAME }}"
      - name: Publish RPM
        if: steps.check_publish.outputs.should_publish == 'true'
        run: |
          set -euo pipefail

          RPM_FILE=$(find ./build/rpm \
            -name "${{ matrix.package }}-*.rpm" \
            -type f | head -n1)

          if [[ -z "$RPM_FILE" ]]; then
            echo "[ERROR] No RPM found for ${{ matrix.package }}"
            ls -la build/rpm
            exit 1
          fi

          echo "[INFO] 📦 Publishing RPM: $RPM_FILE"

          pulp rpm content upload \
            --repository="${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}" \
            --file="$RPM_FILE"

          PUB_HREF=$(pulp rpm publication create \
            --repository="${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}" | jq -r '.pulp_href')

          pulp rpm distribution update \
            --name="${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}" \
            --base-path="${{ vars.MECHA_PULP_RPMS_REPOSITORY_NAME }}" \
            --publication="$PUB_HREF"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-artifacts
          path: build/
