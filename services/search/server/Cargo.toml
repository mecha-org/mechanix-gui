[package]
name = "mxsearch"
description = "Search service for the Mechanix shell"
version = "0.1.1"
edition = "2024"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
zbus = { workspace = true }
env_logger = "0.11.8"
thiserror = "2.0.12"
toml = "0.9.2"
apps = { path = "../apps" }
files = { path = "../files" }
app_actions = { path = "../app_actions" }
sources = { path = "../sources" }

[package.metadata.deb]
maintainer = "Minesh Purohit <mineshp@mechasystems.com>"
extended-description = """\
A simple and fast search engine for your apps and files."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    # target/release path is special, and gets replaced by cargo-deb with the actual target dir path.
    [
        "../../../target/release/mxsearch",
        "usr/bin/",
        "755",
    ],
    [
        "settings.toml.example",
        "usr/share/mechanix/mxsearch/settings.toml",
        "755",
    ],

]

[package.metadata.generate-rpm]
summary = "Search service for the Mechanix shell"
license = "MIT" # or workspace override if you have one
auto-req = "yes"
assets = [
    # Binary
    { source = "../../../target/release/mxsearch", dest = "/usr/bin/mxsearch", mode = "755" },
]
