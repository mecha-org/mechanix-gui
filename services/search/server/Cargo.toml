[package]
name = "mxsearch"
description = "Search service for the Mechanix shell"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
zbus = { workspace = true }
env_logger = "0.11.8"
thiserror = "2.0.12"
toml = "0.9.2"
apps = { path = "../apps" }
files = { path = "../files" }
app_actions = { path = "../app_actions" }

[package.metadata.deb]
maintainer = "Minesh Purohit <mineshp@mechasystems.com>"
extended-description = """\
Configuration system for the Mechanix shell, services and gui apps."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    # target/release path is special, and gets replaced by cargo-deb with the actual target dir path.
    [
        "../../../target/release/mxsearch",
        "usr/bin/",
        "755",
    ],

]
